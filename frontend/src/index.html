<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Sistema de Gestão</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* Estilos do Splash / Fallback de Carregamento */
    .app-loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e0e0e0;
      border-bottom-color: #007bff;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Este HTML é exibido enquanto o Angular não substitui o <app-root> após o bootstrap -->
    <div class="app-loading-splash">
      <div class="spinner"></div>
      <h2>Carregando aplicação...</h2>
      <p style="color: #6c757d; font-size: 14px;">Conectando aos serviços de autenticação</p>
    </div>
  </app-root>
</body>
</html>
