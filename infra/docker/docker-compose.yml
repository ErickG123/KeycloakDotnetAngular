networks:
  gestao-network:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Database do Keycloak (PostgreSQL)
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - gestao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Identity Provider (Keycloak)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - gestao-network
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Database do Negócio - API .NET (PostgreSQL)
  # ---------------------------------------------------------------------------
  app-db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gestao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend API (.NET 10 CQRS)
  # ---------------------------------------------------------------------------
  backend-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=app-db;Database=app_db;Username=app_user;Password=app_password"
      Jwt__Authority: "http://keycloak:8080/realms/gestao-realm"
      Jwt__Audience: "gestao-api"
    ports:
      - "5000:5000"
    networks:
      - gestao-network
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend SPA (Angular + Nginx)
  # ---------------------------------------------------------------------------
  frontend-spa:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: frontend-spa
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - gestao-network
    depends_on:
      - backend-api

volumes:
  keycloak_db_data:
  app_db_data:
